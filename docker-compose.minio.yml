# Dedicated MinIO for Bhoomi Suvidha partner APIs (DPR / attachment storage).
# Usage: docker compose -f docker-compose.minio.yml up -d
services:
  bhoomi-minio:
    image: quay.io/minio/minio:latest
    container_name: bhoomi-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      # API (S3) — avoid clash with langfuse minio on 9090
      - "9100:9000"
      # Console UI
      - "9101:9001"
    volumes:
      - bhoomi-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  bhoomi-minio-data:
